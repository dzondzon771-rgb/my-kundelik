/* Firebase sign-in UI — scoped to avoid changing the original Smart Starosta design. */
#root[hidden],#cloud-bar[hidden],#cloud-gate[hidden],#cloud-setup[hidden],#cloud-confirm-field[hidden],#cloud-auth-forgot[hidden]{display:none!important}
#cloud-gate,#cloud-setup{position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;overflow:auto;padding:22px;background:linear-gradient(145deg,#e7f5ee,#f9fafb 48%,#e6efe8);font:inherit;color:#173629}
.cloud-login-card{width:min(100%,420px);margin:auto;padding:29px;border:1px solid #d7e5dc;border-radius:23px;background:#fff;box-shadow:0 24px 70px #23473325}
.cloud-logo{width:52px;height:52px;border-radius:15px;background:#27664f;color:white;display:grid;place-items:center;font-size:27px;margin-bottom:17px}
.cloud-login-card h1{font-size:26px;font-weight:800;letter-spacing:-.6px;line-height:1.2;margin:0 0 8px}
.cloud-login-card p{font-size:14px;line-height:1.5;color:#65766e;margin:0 0 23px}
.cloud-login-card label{display:block;font-size:13px;font-weight:700;margin-bottom:15px}
.cloud-login-card input{display:block;width:100%;margin-top:7px;border:1px solid #cddbd3;background:#fbfdfb;border-radius:12px;padding:13px 14px;min-height:47px;font-size:16px;outline:none}
.cloud-login-card input:focus{border-color:#27664f;box-shadow:0 0 0 3px #27664f20}
.cloud-primary{width:100%;border:0;background:#27664f;color:white;font-size:15px;font-weight:700;cursor:pointer;border-radius:12px;padding:13px 16px;min-height:46px;margin-top:4px}
.cloud-primary:disabled{opacity:.6;cursor:wait}
.cloud-text-button{display:block;width:100%;border:0;background:none;color:#27664f;font-weight:700;font-size:14px;min-height:36px;margin-top:7px;cursor:pointer}
#cloud-auth-error,#cloud-setup-error{min-height:20px;color:#aa4237;font-size:13px;line-height:1.4;margin-bottom:8px;white-space:pre-line}
.cloud-login-note{text-align:center;color:#85938b;font-size:12px;margin-top:16px}
#cloud-bar{display:flex;position:relative;z-index:300;min-height:41px;padding:6px 14px;align-items:center;gap:10px;justify-content:space-between;background:#ecf7ef;border-bottom:1px solid #c7e2d1;color:#21533e;font-size:12px;font-weight:600}
#cloud-user-email{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:28vw}
#cloud-status{flex:1;min-width:80px;text-align:center}
#cloud-status[data-kind="error"]{color:#a12b2b}
#cloud-status[data-kind="pending"]{color:#966012}
#cloud-logout{border:1px solid #aecdbb;border-radius:9px;background:#fff;padding:6px 10px;color:#235b44;cursor:pointer;font-size:12px;font-weight:700;white-space:nowrap}
@media(max-width:500px){.cloud-login-card{padding:22px}.cloud-login-card h1{font-size:23px}#cloud-bar{gap:6px;font-size:10px;padding:6px}#cloud-logout{font-size:11px;padding:5px 7px}#cloud-user-email{max-width:27vw}}
</style></head><body><div id="root" hidden><div class="loading">Smart Starosta ашылуда…</div></div><div id="cloud-bar" hidden><span id="cloud-user-email"></span><span id="cloud-status" role="status" aria-live="polite">Firebase қосылуда…</span><button type="button" id="cloud-logout">Шығу</button></div><section id="cloud-gate" aria-label="Кіру және тіркелу"><div class="cloud-login-card"><div class="cloud-logo" aria-hidden="true">✦</div><h1 id="cloud-auth-title">Күнделікке кіру</h1><p id="cloud-auth-subtitle">Өз мәліметтеріңді телефоннан да, компьютерден де аш.</p><form id="cloud-auth-form"><label>Email<input type="email" name="email" autocomplete="email" placeholder="email@example.com" required></label><label>Құпиясөз<input type="password" name="password" autocomplete="current-password" minlength="6" required placeholder="Кемінде 6 таңба"></label><label id="cloud-confirm-field" hidden>Құпиясөзді қайтала<input type="password" name="confirm" autocomplete="new-password" minlength="6" placeholder="Қайталап жаз"></label><div id="cloud-auth-error" role="status" aria-live="polite"></div><button class="cloud-primary" id="cloud-auth-submit" type="submit">Кіру</button></form><button class="cloud-text-button" id="cloud-auth-toggle" type="button">Аккаунтың жоқ па? Тіркелу</button><button class="cloud-text-button" id="cloud-auth-forgot" type="button">Құпиясөзді ұмыттың ба?</button><div class="cloud-login-note">Smart Starosta · жеке онлайн күнделік</div></div></section><section id="cloud-setup" aria-label="Топты алғашқы рет баптау" hidden>
  <div class="cloud-login-card">
    <div class="cloud-logo" aria-hidden="true">✦</div>
    <h1>Күнделігіңді баптау</h1>
    <p>Дайын есімдер жоқ. Топ атауын өзің енгіз, кейін студенттердің атын өзгерте аласың.</p>
    <form id="cloud-setup-form">
      <label>Топ атауы *<input name="group" placeholder="Мысалы: БҚ-21" maxlength="30" autocomplete="off" required></label>
      <label>Старостаның аты (міндетті емес)<input name="leader" placeholder="Өз атыңды енгіз" maxlength="80" autocomplete="off"></label>
      <label>Студенттер саны<input name="count" type="number" min="1" max="60" value="24" required></label>
      <div id="cloud-setup-error" role="alert"></div>
      <button class="cloud-primary" type="submit">Күнделікті ашу</button>
    </form>
    <button class="cloud-text-button" type="button" id="cloud-setup-logout">Басқа аккаунтпен кіру</button>
  </div>
